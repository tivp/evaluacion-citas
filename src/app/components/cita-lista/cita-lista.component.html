<ion-list>
  <ion-item *ngFor="let c of citas">
    <ion-label class="ion-text-wrap">
      <h3>{{ c.frase }}</h3>
      <p class="ion-text-right">{{ c.autor }}</p>
    </ion-label>
    <ion-button fill="clear" color="primary" slot="end" (click)="eliminar(c.id)">
      <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
    </ion-button>
  </ion-item>
</ion-list>
