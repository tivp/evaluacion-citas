<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Configuraciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-toggle
        [(ngModel)]="permitirEliminarInicio"
        (ionChange)="guardarCambio()">
        Permitir eliminar citas en el inicio
      </ion-toggle>
    </ion-item>
  </ion-list>
</ion-content>
